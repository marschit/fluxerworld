name: Sync Upstream & Build RedFlux

on:
  schedule:
    # Täglich um 06:00 UTC prüfen
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if no upstream changes'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
      conflict: ${{ steps.sync.outputs.conflict }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/guild-soundboard
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/fluxerapp/fluxer.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new upstream commits
        id: sync
        run: |
          UPSTREAM_BRANCH="main"
          LOCAL_UPSTREAM_HEAD=$(git rev-parse upstream/$UPSTREAM_BRANCH 2>/dev/null || echo "none")
          MERGE_BASE=$(git merge-base HEAD upstream/$UPSTREAM_BRANCH 2>/dev/null || echo "none")

          if [ "$LOCAL_UPSTREAM_HEAD" = "$MERGE_BASE" ]; then
            echo "No new upstream commits"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            # Try merge
            if git merge upstream/$UPSTREAM_BRANCH --no-edit; then
              echo "Merge successful"
              echo "conflict=false" >> "$GITHUB_OUTPUT"
              git push origin feature/guild-soundboard
            else
              echo "Merge has conflicts"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              git merge --abort
            fi
          fi

      - name: Create PR on conflict
        if: steps.sync.outputs.conflict == 'true'
        run: |
          # Create a temp branch with the attempted merge
          git checkout -b upstream-sync-$(date +%Y%m%d)
          git merge upstream/main --no-commit || true
          git add -A
          git commit -m "chore: upstream sync (conflicts need manual resolution)" || true
          git push origin upstream-sync-$(date +%Y%m%d)

          gh pr create \
            --title "Upstream sync: manual merge needed" \
            --body "$(cat <<'EOF'
          ## Upstream Sync

          New commits from `fluxerapp/fluxer` could not be auto-merged due to conflicts.

          Please resolve the conflicts manually in the following areas (likely RedFlux branding or soundboard changes).

          🤖 Generated by sync-upstream workflow
          EOF
          )" \
            --base feature/guild-soundboard \
            --head upstream-sync-$(date +%Y%m%d)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || inputs.force_build == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac dmg
          - os: macos-latest
            platform: linux-arm64
            args: --linux AppImage deb tar.gz --arm64 -c.npmRebuild=false
          - os: ubuntu-latest
            platform: linux-x64
            args: --linux AppImage deb tar.gz --x64
          - os: windows-latest
            platform: win
            args: --win nsis --x64 --arm64 -c.npmRebuild=false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/guild-soundboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: fluxer_desktop
        run: npm install

      - name: Set build channel
        working-directory: fluxer_desktop
        run: node scripts/set-build-channel.mjs

      - name: Build Electron main process
        working-directory: fluxer_desktop
        run: node scripts/build.mjs

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build packages
        working-directory: fluxer_desktop
        run: npx electron-builder ${{ matrix.args }} --config electron-builder.config.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redflux-${{ matrix.platform }}
          path: |
            fluxer_desktop/dist-electron/*.dmg
            fluxer_desktop/dist-electron/*.AppImage
            fluxer_desktop/dist-electron/*.deb
            fluxer_desktop/dist-electron/*.tar.gz
            fluxer_desktop/dist-electron/*.exe
            !fluxer_desktop/dist-electron/*.__uninstaller*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redflux-${{ github.run_number }}
          name: RedFlux Desktop ${{ github.run_number }}
          body: |
            RedFlux Desktop Client — custom build for flux.mamallow.net
            (synced with upstream fluxerapp/fluxer)

            ## Downloads
            | Platform | x64 | arm64 |
            |----------|-----|-------|
            | **macOS** | — | `.dmg` |
            | **Linux** | `.AppImage` `.deb` `.tar.gz` | `.AppImage` `.deb` `.tar.gz` |
            | **Windows** | `.exe` | `.exe` |
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
